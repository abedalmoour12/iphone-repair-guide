  <script src="data_iphone12.js"></script>
  <script src="data_iphone13.js"></script>
  <script src="data_iphone14.js"></script>
  <script src="data_iphone15.js"></script>
  <script src="data_iphone16.js"></script>
  <script src="data_iphone17.js"></script>

  <style>
    /* تنسيق الصور التوضيحية داخل الكارت */
    .issue-images {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px dashed #334155;
    }
    .issue-img-box {
      flex: 1;
      min-width: 200px;
      background: #0b0f19;
      border: 1px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      padding: 6px;
      text-align: center;
    }
    .issue-img-box img {
      width: 100%;
      height: auto;
      max-height: 220px;
      object-fit: contain;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .issue-img-box img:hover {
      transform: scale(1.02);
    }
    .issue-img-caption {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 6px;
    }
  </style>

  <script>
    const allDevices = [
      ...((typeof iphone11_data !== 'undefined') ? iphone11_data : []),
      ...((typeof iphone12_data !== 'undefined') ? iphone12_data : []),
      ...((typeof iphone13_data !== 'undefined') ? iphone13_data : []),
      ...((typeof iphone14_data !== 'undefined') ? iphone14_data : []),
      ...((typeof iphone15_data !== 'undefined') ? iphone15_data : []),
      ...((typeof iphone16_data !== 'undefined') ? iphone16_data : []),
      ...((typeof iphone17_data !== 'undefined') ? iphone17_data : [])
    ];

    let selectedIndex = 0;

    function initApp() {
      const btnContainer = document.getElementById('device-buttons');
      btnContainer.innerHTML = '';

      allDevices.forEach((dev, idx) => {
        const btn = document.createElement('button');
        btn.className = `device-btn ${idx === selectedIndex ? 'active' : ''}`;
        btn.innerText = dev.name.split('/')[0];
        btn.onclick = () => {
          selectedIndex = idx;
          initApp();
        };
        btnContainer.appendChild(btn);
      });

      if (allDevices.length > 0) {
        document.getElementById('current-device-title').innerText = `أعطال: ${allDevices[selectedIndex].name}`;
        renderIssues(allDevices[selectedIndex].issues);
      }
    }

    function renderIssues(issues) {
      const container = document.getElementById('issues-container');
      container.innerHTML = '';

      if(issues.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#94a3b8;">لا توجد نتائج مطابقة للبحث</p>';
        return;
      }

      issues.forEach(issue => {
        let tableHTML = '';
        if (issue.testPoints && issue.testPoints.length) {
          tableHTML = `
            <table>
              <tr><th>المسار</th><th>الممانعة</th><th>الجهد</th></tr>
              ${issue.testPoints.map(tp => `
                <tr>
                  <td><b style="color:#e2e8f0;">${tp.line}</b></td>
                  <td>${tp.diode}</td>
                  <td>${tp.volt}</td>
                </tr>
              `).join('')}
            </table>
          `;
        }

        // توليد HTML الخاص بالصور إذا وجدت في العطل
        let imagesHTML = '';
        if (issue.images && issue.images.length) {
          imagesHTML = `
            <div class="issue-images">
              ${issue.images.map(img => `
                <div class="issue-img-box">
                  <img src="${img.url}" alt="توضيح العطل" loading="lazy" onclick="window.open(this.src, '_blank')">
                  <div class="issue-img-caption">${img.caption || ''}</div>
                </div>
              `).join('')}
            </div>
          `;
        }

        const card = document.createElement('div');
        card.className = 'issue-card';
        card.innerHTML = `
          <h3 class="issue-title">
            <span>${issue.title}</span>
            <span class="badge">${issue.category}</span>
          </h3>
          <p style="font-size:0.9rem;"><b style="color:#f59e0b;">السبب:</b> ${issue.cause}</p>
          <ol>${issue.steps.map(s => `<li>${s}</li>`).join('')}</ol>
          ${tableHTML}
          ${imagesHTML}
        `;
        container.appendChild(card);
      });
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      if (!allDevices[selectedIndex]) return;

      const filtered = allDevices[selectedIndex].issues.filter(i => 
        i.title.toLowerCase().includes(query) || 
        i.cause.toLowerCase().includes(query) ||
        (i.testPoints && i.testPoints.some(tp => tp.line.toLowerCase().includes(query)))
      );
      renderIssues(filtered);
    });

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
